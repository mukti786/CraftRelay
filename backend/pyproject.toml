[project]
name = "craftrelay-api"
version = "0.1.0"
description = "CraftRelay RPL assessment and service discovery API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1", "sqlalchemy[asyncio]>=2,<3", "alembic>=1.14,<2", "asyncpg>=0.30,<1", "aiosqlite>=0.20,<1", "pydantic-settings>=2.6,<3", "email-validator>=2,<3", "PyJWT[crypto]>=2.10,<3", "pwdlib[argon2]>=0.2,<1", "python-multipart>=0.0.12,<1"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "httpx>=0.28,<1", "ruff>=0.9,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
ignore = ["B008"]
